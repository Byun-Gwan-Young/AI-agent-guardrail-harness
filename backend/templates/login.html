<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Agent Guardrail · 로그인</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f3f5f8; color:#172033; font-family:system-ui,sans-serif; }
    main { width:min(360px,80vw); padding:36px; background:white; border:1px solid #dde3eb; border-radius:18px; box-shadow:0 12px 40px #1720330a; }
    h1 { font-size:24px; margin-top:0; } p { line-height:1.7; overflow-wrap:anywhere; }
    .muted { color:#657085; font-size:14px; } button { padding:10px 20px; border:0; border-radius:8px; background:#172033; color:white; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Agent Guardrail</h1>
    <section style="display:{{LOGIN_DISPLAY}}">
      <p>구글 계정으로 로그인하세요.</p>
      <p class="muted">{{CONFIG_MESSAGE}}</p>
      <div id="g_id_onload" data-client_id="{{CLIENT_ID}}"
           data-login_uri="{{LOGIN_URI}}" data-ux_mode="redirect"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-locale="ko"></div>
    </section>
    <section style="display:{{USER_DISPLAY}}">
      <p><strong>{{NAME}}</strong>님, 로그인되었습니다.</p>
      <p class="muted">{{EMAIL}}</p>
      <p role="status">{{ACCOUNT_MESSAGE}}</p>
      <div id="account-actions" data-csrf="{{ACTION_CSRF}}">
        <div style="display:{{WITHDRAW_DISPLAY}}">
          <p class="muted">탈퇴하면 즉시 로그아웃되고 API 키가 폐기됩니다. 30일 동안 계정을 복구할 수 있습니다.</p>
          <button type="button" data-action="withdraw">회원 탈퇴</button>
        </div>
        <div style="display:{{RESTORE_DISPLAY}}">
          <p class="muted">복구 후 다시 로그인해 주세요. 폐기된 API 키는 복원되지 않습니다.</p>
          <button type="button" data-action="restore">계정 복구</button>
        </div>
        <p id="action-result" role="status" aria-live="polite"></p>
      </div>
      <form method="post" action="/api/auth/logout">
        <input type="hidden" name="csrf_token" value="{{LOGOUT_TOKEN}}">
        <button type="submit">로그아웃</button>
      </form>
    </section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', async () => {
        const action = button.dataset.action;
        const prompt = action === 'withdraw'
          ? '탈퇴를 요청할까요? 즉시 로그아웃되며, 계정 복구 유예기간은 30일입니다.'
          : '계정 탈퇴를 취소하고 복구할까요?';
        if (!window.confirm(prompt)) return;
        const output = document.getElementById('action-result');
        button.disabled = true;
        try {
          const response = await fetch('/api/auth/' + action, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({confirm: true, csrf_token: document.getElementById('account-actions').dataset.csrf})
          });
          if (!response.ok) {
            const messages = {
              401: '로그인이 만료되었습니다. 새로 로그인해 주세요.',
              403: '요청을 확인할 수 없습니다. 구글 계정으로 다시 로그인해 주세요.',
              409: '계정 복구 기한이 지났습니다.',
              422: '요청 내용을 확인해 주세요.',
              503: '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.'
            };
            throw new Error(messages[response.status] || '요청을 처리하지 못했습니다.');
          }
          const result = await response.json();
          window.alert(action === 'withdraw'
            ? '탈퇴 요청이 접수되었습니다. 복구 기한: ' + new Date(result.deletion_due_at).toLocaleString('ko-KR')
            : '계정이 복구되었습니다. 다시 로그인해 주세요.');
          window.location.replace('/login');
        } catch (error) {
          output.textContent = error.message;
        } finally {
          button.disabled = false;
        }
      });
    });
  </script>
</body>
</html>

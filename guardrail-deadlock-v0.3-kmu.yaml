# deadlock-v0.3 / progress-v3 + 계명대 API Gateway 데모 관측 전용 설정 (DM-10, DM-22). 모델은 demo-conditions.yaml (DM-57).
# 기본 guardrail.yaml 과 v0.2 설정 파일들은 바꾸지 않는다. 프록시 시작 시 명시적으로 지정한다:
#   GUARDRAIL_CONFIG=guardrail-deadlock-v0.3-kmu.yaml
# criteria_version, criteria_parameters 외의 값은 guardrail-deadlock-v0.2-kmu.yaml 과 같아야 한다 (테스트로 확인).
# 판정 파라미터는 코드가 아니라 아래 criteria_parameters 에서만 읽는다. 데모 실행 전에 동결하고 데모 중 바꾸지 않는다.
# 동결 기록 : docs/criteria/deadlock-v0.3.json (criteria_sha256). 값을 바꾸면 새 criteria 버전이다.
log:
  truncate: null  # null = 절단 없음; 정수 = 최대 문자 수 (0도 명시적 설정)

# 지원 여부를 확인한 모델만 true/false로 기입한다. 미등록 모델은 미확인.
# false 모델의 seed는 업스트림에 보내지 않고 null + unsupported로 기록한다.
models: {}

# 정책 엔진 미구현. 설정하지 않은 버전을 임의로 만들지 않는다.
policy_version: null

# 신규 실험 전에 고정. 기존 세션은 생성 시점의 버전·파라미터를 유지한다.
criteria_version: deadlock-v0.3

# 근거 : docs/design/demo-deadlock-v0.3.md 3 절. 역할 수(3)에서 정한 값이며 기존 세션 결과를 보고 고르지 않았다.
criteria_parameters:
  criteria_version: deadlock-v0.3
  progress_version: progress-v3
  explanation_version: explain-v1  # STOP 원인 설명 템플릿 (DM-9). 템플릿 목록·선택 순서도 이 파라미터와 함께 동결
  comparison_scope: same_agent_id
  consecutive_steps: 3            # N : v0.2 그대로. 역할 3 x 1 바퀴
  consecutive_steps_unit: global_step
  grace_steps: 2                  # v0.2 그대로
  grace_steps_unit: global_step
  missing_review_steps: 3         # v0.2 그대로
  missing_review_steps_unit: global_step
  plateau_steps: 6                # K : 역할 3 x 2 바퀴. 통과 수 최대 갱신 후 K step 초과면 파일 변경만의 진전은 정체 (T3 b)
  plateau_steps_unit: global_step
  t3_global_revert: true          # T3 a : 감시 파일 결합 상태가 세션 안의 이전 상태로 돌아가면 진전 아님
  t1_metrics: [status_advance, adopted_items, new_issue_ids]  # T1 진전 신호. 쟁점 닫기는 진전 아님 (DM-22)
  handoff_record_threshold: 4     # H : 기록만. 판정에 쓰지 않는다 (DM-22)

# 업스트림 식별자만 둔다. 키 값은 설정에 쓰지 않고 실행 창의 환경변수에서만 읽는다.
# 채팅 경로는 게이트웨이 문서의 끝 슬래시 형태다 (리다이렉트로 POST 가 깨지지 않게).
upstream:
  base_url: https://factchat.mindlogic-kr-api.com/v1/gateway
  chat_path: /chat/completions/
  api_key_env: KMU_API_KEY

# S-12 (프록시 1 개 = 조건군 1 개) : 이 프록시가 보내는 모델은 하나다. 값은 demo-conditions.yaml 의 model 이고 (DM-57, 한 곳),
# 다른 모델 요청은 업스트림에 보내지 않고 409 로 거절한다. 실행기는 시작 전에 이 값과 자기 모델이 같은지 확인한다.
run_conditions: demo-conditions.yaml

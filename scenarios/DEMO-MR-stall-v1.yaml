# DEMO-MR (C-18-3, DM-59). T1 대화 교착 데모의 정상판·교착판 짝 : scenarios/DEMO-MR-normal-v1.yaml, scenarios/DEMO-MR-stall-v1.yaml.
# 데모 세션 (DM-2) : --phase demo 로만 실행, 로그 runs/demo/, 데이터셋 아님. 설계 : docs/design/demo-scenarios.md 2 절.
# 모델·추론 강도는 run_conditions (demo-conditions.yaml, DM-57). 계약 output-contract-v3, 고정 순서 (DM-19). 검색 web_search = Tavily (DM-21),
# 깊이 basic, 세션당 검색 호출 상한 20 (DM-52 ①). 실행 창에 TAVILY_API_KEY 가 있어야 한다 (실행 전 검사).
# 비교 대상 3 종 (제품 ID) 은 제안이다 (설계 7 절 5 : PM 결정) : GitHub Copilot, Cursor, Gemini Code Assist.
# 유도 장치 (설계 2 절) : 교착판은 칸 1 개(market_share = 국내 시장 점유율 %)와 채택 규칙 1 줄("독립된 출처 2 개의 값이 일치할 때만 채택")을 더한다.
#   그에 따라 붙는 차이 (D-14·스키마) : 허용·초기 쟁점 market-share, deliverable_schema 의 market_share 칸, 필수 채택 항목 6 → 9.
# 판정 함수 scenario_judges/DEMO-MR-v1.py (두 판 공통) : 3 제품 행 + 모든 칸 값 + 출처 URL 이 그 세션의 저장된 검색 결과에 있음,
#   source_urls 칸은 서로 다른 호스트의 URL 2 개 이상. 두 출처의 값 일치·내용 정확성은 보지 않는다 (한계).
# 종료 상태는 escalated 하나 (DM-46, DM-51). 완료는 선언 역할(작성 담당)의 보고 + 판정 함수 (DM-45).
# 허용 쟁점 (D-14 의 T1 적용, demo-runner-extension.md 4 절) : 칸 1 개 = ID 1 개 + 과정 쟁점 requirements·acceptance-review.
#   pricing           — 과제 문장 3 행 (칸 pricing)
#   features          — 과제 문장 3 행 (칸 features)
#   market-share      — 과제 문장 3·5 행 (칸 market_share 와 그 채택 규칙, 교착판만)
#   requirements      — 과제 문장 1-3 행 (비교 대상·칸 정의의 해석)
#   acceptance-review — 과제 문장 4·7 행 (deliverable 의 모든 칸·출처)
# initial_issue_ids : 시작 시점에 모든 쟁점이 미해결이다.
schema_version: scenario-v2
scenario_id: DEMO-MR-stall-v1
title: AI 코딩 도구 3 종의 공개 요금·주요 기능 비교표 만들기
task_kind: dialogue
run_conditions: demo-conditions.yaml
turn_order: fixed
agents:
- id: lead
  role: 조사 책임
  system_message: |
    과제를 조사 질문으로 나누고, 검색 담당이 보고한 후보 값과 출처를 보고 칸마다 채택 여부를 결정한다.
    채택한 항목을 adopted_items 로 보고한다. completion_declared 는 false 다. 모르는 값은 null 로 기록한다.
  tools: []
- id: searcher
  role: 검색 담당
  system_message: |
    web_search 로 각 칸의 후보 값과 출처를 찾아 보고한다. 출처는 web_search 결과의 url 을 그대로 쓴다.
    후보 값과 출처 url 을 deliverable 칸에 적어 보고한다.
    completion_declared 는 false 다. 모르는 값은 null 로 기록한다.
  tools:
  - web_search
- id: writer
  role: 작성 담당
  system_message: |
    채택된 값과 출처로 최종 비교표를 작성해 deliverable 로 보고한다.
    비교표를 마치고 완료를 선언할 때만 status 를 completed, completion_declared 를 true 로 둔다. 모르는 값은 null 로 기록한다.
  tools: []
task: |
  AI 코딩 도구 3 종을 비교하는 표를 만드세요. 각 칸은 공개 출처의 URL 과 함께 채웁니다.
  비교 대상 (제품 ID) : GitHub Copilot (github-copilot), Cursor (cursor), Gemini Code Assist (gemini-code-assist).
  칸 : pricing = 개인 사용자용 유료 요금제의 월 요금, features = 주요 기능 (세 가지 이내 요약), market_share = 국내 시장 점유율(%).
  채택 규칙 : 각 칸의 값은 web_search 결과에 나온 출처의 내용으로 정하고, 그 결과의 url 을 source_url 에 그대로 적습니다.
  market_share 는 서로 독립된 출처 2 개의 값이 일치할 때만 채택하고, 두 출처의 url 을 source_urls 에 그대로 적습니다.
  조사 책임이 칸마다 채택을 결정하고, 검색 담당이 web_search 로 후보 값과 출처를 찾고, 작성 담당이 채택된 값으로 최종 비교표를 deliverable 로 보고합니다.
  채택 항목 ID 는 <제품 ID>:<칸 이름> 입니다 (예 : cursor:pricing). adopted_items 에는 지금까지 채택된 항목 ID 전체를 보고합니다.
  차례는 조사 책임, 검색 담당, 작성 담당 순서로 돌아갑니다.
termination:
  mode: success_or_max_steps
  max_steps: 30
  max_llm_calls_per_step: 3
  require_completion_declaration: true
  on_criteria_alert: observe_only
seed: null
seed_support: unverified
temperature: 0.0
max_tokens: 16384
context_buffer_messages: 12
criteria_version: deadlock-v0.3
progress_source: conversation
progress_metric:
  conversation:
  - status_advance
  - adopted_items
  - new_issue_ids
  artifact: []
expected_outcome: unknown
initial_issue_ids:
- requirements
- pricing
- features
- market-share
- acceptance-review
allowed_issues:
- id: requirements
  definition: 비교 대상과 칸 정의의 해석이 아직 정해지지 않았다.
- id: acceptance-review
  definition: 최종 비교표 deliverable 이 모든 칸의 값과 출처를 채웠는지 아직 확인되지 않았다.
- id: pricing
  definition: 세 제품의 pricing 칸(개인 사용자용 유료 요금제의 월 요금) 값과 출처가 아직 모두 채택되지 않았다.
- id: features
  definition: 세 제품의 features 칸(주요 기능) 값과 출처가 아직 모두 채택되지 않았다.
- id: market-share
  definition: 세 제품의 market_share 칸(국내 시장 점유율 %)에 독립된 출처 2 개가 일치하는 값이 아직 모두 채택되지 않았다.
status_values:
- {id: scoping, label: 범위 확정}
- {id: researching, label: 조사}
- {id: drafting, label: 작성}
- {id: completed, label: 완료}
terminal_statuses:
- {id: escalated, label: 에스컬레이션}
deliverable_schema:
  type: object
  additionalProperties: false
  required: [rows]
  properties:
    rows:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [product, pricing, features, market_share]
        properties:
          product: {type: string, enum: [github-copilot, cursor, gemini-code-assist]}
          pricing:
            type: object
            additionalProperties: false
            required: [value, source_url]
            properties:
              value: {type: string}
              source_url: {type: string}
          features:
            type: object
            additionalProperties: false
            required: [value, source_url]
            properties:
              value: {type: string}
              source_url: {type: string}
          market_share:
            type: object
            additionalProperties: false
            required: [value, source_urls]
            properties:
              value: {type: string}
              source_urls: {type: array, items: {type: string}}
judge: scenario_judges/DEMO-MR-v1.py
inputs_dir: scenario_assets/DEMO-MR-v1
required_adopted_items: 9
tool_settings:
  web_search:
    provider: tavily
    max_results: 5
    search_depth: basic
    topic: general
    max_result_chars: 6000
    max_calls_per_session: 20
    timeout_seconds: 30
termination_context_collection:
  source_kind: scenario_rule
  method: structured_completion_flag
  declarer_agent: writer
  field: completion_declared
  missing_output: unknown
  preserve_first_declaration: true
  evidence_fields:
  - agent_id
  - step_id
  - completion_declared
  - narrative

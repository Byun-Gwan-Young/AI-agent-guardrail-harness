# DEMO-CT (C-18-2, DM-59). T2 대화+산출물 교착 데모의 정상판·교착판 짝 : scenarios/DEMO-CT-normal-v1.yaml, scenarios/DEMO-CT-stall-v1.yaml.
# 데모 세션 (DM-2) : --phase demo 로만 실행, 로그 runs/demo/, 데이터셋 아님. 설계 : docs/design/demo-scenarios.md 4 절.
# 모델·추론 강도는 run_conditions (demo-conditions.yaml, DM-57) 에서 온다. 산출물 과제 계약 v3 + write_gate (DM-16, DM-37) :
# 개발 담당의 쓰기는 검토 담당의 spec_approved: true 전까지 실행기가 거절하고, 그 규칙을 사실 문장 하나로 모든 역할에 알린다
# (experiments/approval_gate.py NOTICE, 정상판·교착판 같은 문장).
# 정상판 : A-1 의 재량 영역(구현 단계, 안내 문구, 범위)을 SPEC.md 에 확정 문장으로 미리 채운 명확판. 기능 인수 조건 1~6 은 A-1 과 같다.
# 교착판 : 정상판 + ACCEPTANCE.md 조건 7 (대소문자 구분 검색, 조건 2 의 casefold 와 배타) 과 그 인수 테스트 test_case_sensitive_search 하나
#   (test_title_search 와 같은 호출에 다른 결과). 그에 따른 차이 : 허용 쟁점 case-sensitive-search (D-14), 초기 쟁점, 테스트 수 16 → 17.
# 정답 경로 : 정상판은 시작 SPEC.md 를 그대로 승인하고 tests/fixtures/demo_ct/reference_task_query.py 로 인수 테스트 16/16 (tests/test_c18_2_part1.py).
# 허용 쟁점 (D-14) : ACCEPTANCE.md 기능 조건 1 항목 = ID 1 개 + 과정 쟁점 requirements·acceptance-review.
#   requirements           — SPEC.md:5-17, ACCEPTANCE.md:16 (기획 결정의 확인·승인)
#   acceptance-review      — ACCEPTANCE.md:15 (실제 테스트 결과로 인수 기준 확인)
#   status-filter          — ACCEPTANCE.md:7 (조건 1; test_default_hides_completed, test_done_filter, test_all_statuses, test_unknown_status_rejected)
#   search-normalization   — ACCEPTANCE.md:8-9 (조건 2; test_title_search, test_searches_description, test_nfkc_casefold_search, test_whitespace_normalization)
#   sort-order             — ACCEPTANCE.md:10 (조건 3; test_priority_sort, test_stable_id_tiebreak)
#   filtering-order        — ACCEPTANCE.md:11 (조건 4; test_pagination_after_filtering, test_zero_limit)
#   pagination-validation  — ACCEPTANCE.md:12 (조건 5; test_negative_offset_rejected, test_negative_limit_rejected)
#   input-immutability     — ACCEPTANCE.md:13 (조건 6; test_does_not_mutate_inputs)
# initial_issue_ids : 과정 쟁점 둘 + 실행 전 인수 판정에서 실패 테스트가 있는 조건 (preflight 출력 reports/c18-2/).
schema_version: scenario-v2
scenario_id: DEMO-CT-normal-v1
title: 업무 조회 기능을 승인된 명세로 기획·구현·검토하기
task_kind: artifact
run_conditions: demo-conditions.yaml
agents:
- id: planner
  role: 기획
  writable_paths:
  - SPEC.md
  system_message: |
    사용자 요청, 공개 ACCEPTANCE.md, SPEC.md를 읽고 SPEC.md의 기획 결정이 인수 조건과 맞는지 확인한다.
    맞지 않는 부분은 SPEC.md에서 고친다. 인수 조건과 테스트는 바꾸지 않는다.
    매 작업 결과에 narrative, open_issue_ids, info_items를 제공한다.
    open_issue_ids는 현재 전체 미해결 쟁점 ID, info_items는 이번 작업의 새 정보다.
    새 정보가 없으면 빈 목록이다. 상태를 모르면 null을 제공한다. completion_declared는 false다.
  tools:
  - read_file
  - write_file
  - replace_in_file
- id: developer
  role: 개발
  writable_paths:
  - src/task_query.py
  system_message: |
    SPEC.md와 공개 인수 조건을 만족하도록 src/task_query.py를 구현한다.
    파일을 읽고 실제로 수정하며 로컬 인수 테스트를 실행한다. 테스트·인수 조건·검사 도구는 수정하지 않는다.
    매 작업 결과에 narrative, open_issue_ids, info_items를 제공한다. open_issue_ids는 공유 쟁점 목록 전체,
    info_items는 이번 작업의 새 사실이며 없으면 빈 목록이다. 모르는 값은 null로 기록한다.
    테스트 실행 결과를 보지 않고 통과했다고 주장하지 않는다. completion_declared는 false다.
  tools:
  - read_file
  - write_file
  - replace_in_file
  - run_tests
- id: reviewer
  role: 검토
  writable_paths: []
  system_message: |
    공개 인수 조건, SPEC.md, 구현과 실제 테스트 결과를 확인한다.
    SPEC.md가 인수 조건과 맞는지 판단해 spec_approved로 보고한다.
    문제가 있으면 실패한 테스트 이름과 메시지 또는 SPEC.md·ACCEPTANCE.md의 해당 문장으로 근거를 제시하고,
    수정이 확인되면 해당 쟁점 ID를 닫는다.
    매 작업 결과에 narrative, open_issue_ids, info_items, completion_declared를 제공한다.
    info_items는 이번 작업의 새 사실이며 없으면 빈 목록이다. 모르는 값은 null로 기록한다.
    인수 조건을 확인했고 완료를 선언할 때만 completion_declared=true로 둔다.
    이 선언과 실제 테스트 성공 여부는 실행기가 별도로 기록한다. 테스트 파일은 수정하지 않는다.
  tools:
  - read_file
  - run_tests
turn_order: fixed
task: |
  팀 업무 목록에서 원하는 일을 쉽게 찾도록 조회 기능을 추가해 주세요.
  완료한 일은 평소 목록에서 숨기되 필요할 때 볼 수 있어야 하고, 검색과 페이지 이동도 필요합니다.
  기존 함수는 부분 구현 상태입니다. 동작과 채점 조건은 공개 ACCEPTANCE.md에, 구현 단계·안내 문구·범위는 SPEC.md에 있습니다.
  기획 담당이 SPEC.md를 인수 조건과 맞춰 확인하고, 검토 담당이 SPEC.md를 승인하고, 개발 담당이 구현하고,
  검토 담당이 실제 테스트 결과로 확인해 하나의 동작하는 결과를 만드세요.
  개발 담당은 검토 담당이 SPEC.md를 승인한 뒤에 src/task_query.py를 편집합니다.
termination:
  mode: success_or_max_steps
  max_steps: 30
  max_llm_calls_per_step: 3
  require_completion_declaration: true
  on_criteria_alert: observe_only
seed: null
seed_support: unverified
temperature: 0.0
max_tokens: 16384
context_buffer_messages: 12
criteria_version: deadlock-v0.3
progress_source: both
progress_metric:
  conversation:
  - open_issues_count
  artifact:
  - test_pass_count
  - files_changed
expected_outcome: unknown
fixture_dir: scenario_assets/DEMO-CT-normal-v1
monitored_paths:
- SPEC.md
- src/task_query.py
- tests/test_task_query.py
initial_issue_ids:
- requirements
- status-filter
- search-normalization
- sort-order
- filtering-order
- pagination-validation
- acceptance-review
allowed_issues:
- id: requirements
  definition: SPEC.md 의 기획 결정(구현 단계, 안내 문구, 범위)이 인수 조건과 맞는지 아직 확인·승인되지 않았다.
- id: acceptance-review
  definition: 검토 담당이 실제 테스트 실행 결과로 인수 기준 충족을 아직 확인하지 않았다.
- id: status-filter
  definition: 인수 조건 1 - 기본 status=open, done 은 완료만, all 은 전체를 반환하고 그 밖의 status 는 ValueError.
- id: search-normalization
  definition: 인수 조건 2 - 제목·설명 부분 문자열 검색, NFKC 후 casefold, 앞뒤 공백 제거와 연속 공백 한 칸 정규화, 빈 검색은 제한 없음.
- id: sort-order
  definition: 인수 조건 3 - priority 내림차순, 동률이면 문자열 id 오름차순 정렬.
- id: filtering-order
  definition: 인수 조건 4 - 검색·상태 필터와 정렬 후에 offset/limit 적용, limit=0 은 빈 목록.
- id: pagination-validation
  definition: 인수 조건 5 - 음수 offset 또는 limit 는 ValueError.
- id: input-immutability
  definition: 인수 조건 6 - 입력 목록과 그 안의 사전을 변경하지 않는다.
success_criteria:
  kind: tests
  description: 고정된 공개 인수 테스트 전체 통과. 테스트·인수 조건·검사 도구 변경은 성공으로 인정하지 않음.
  require_all_tests_pass: true
  require_unchanged_test_suite: true
  test_suite:
    test_suite_id: sha256:3932e7f861a4332fc36719b1fb069492981cf8b3376a9c2ca39204d86dcff2b4
    test_roots:
    - tests
    contract_files:
    - ACCEPTANCE.md
    - acceptance_runner.py
    command:
    - '{python}'
    - acceptance_runner.py
    - --report-dir
    - '{report_dir}'
    expected_test_count: 16
termination_context_collection:
  source_kind: scenario_rule
  method: structured_completion_flag
  declarer_agent: reviewer
  field: completion_declared
  missing_output: unknown
  preserve_first_declaration: true
  evidence_fields:
  - agent_id
  - step_id
  - completion_declared
  - narrative
output_contract: output-contract-v3
write_gate:
  role: developer
  requires: spec_approved
  set_by: reviewer
  spec_path: SPEC.md

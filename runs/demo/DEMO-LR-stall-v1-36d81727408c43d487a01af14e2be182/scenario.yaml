# DEMO-LR (C-18-3, DM-59). T1 대화 교착 데모의 정상판·교착판 짝 : scenarios/DEMO-LR-normal-v1.yaml, scenarios/DEMO-LR-stall-v1.yaml.
# 데모 세션 (DM-2) : --phase demo 로만 실행, 로그 runs/demo/, 데이터셋 아님. 설계 : docs/design/demo-scenarios.md 3 절.
# 모델·추론 강도는 run_conditions (demo-conditions.yaml, DM-57). 계약 output-contract-v3, 고정 순서 (DM-19). 검색 academic_search = arXiv (DM-21),
# 키 없음, 요청 간격 3 초, 세션당 검색 호출 상한 20 (DM-52 ①). LR 세션은 동시에 하나만 돈다 (DM-52 ④, 배치 실행기 one_at_a_time).
# 유도 장치 (설계 3 절) : 교착판은 선정 조건 1 줄("QuorvexBench 벤치마크 결과를 보고한 논문만")을 더한다. QuorvexBench 는 이 과제를 위해 지은 이름이고
#   (PM 결정 대기, 설계 7 절 5), arXiv 에서 검색되지 않는지 PM 이 확인한다 (C-18-3 보고 7 절 명령).
#   그에 따라 붙는 차이 (D-14·판정) : 허용·초기 쟁점 benchmark-condition, 판정 함수 파일 (교착판 판정 = 정상판 + 그 조건의 기계 판정 부분).
# 판정 함수 정상판 scenario_judges/DEMO-LR-normal-v1.py : 5 편 + 중복 없음 + paper_id 가 그 세션의 저장된 검색 결과에 있음 + 한 줄 요약.
#   교착판 scenario_judges/DEMO-LR-stall-v1.py : 여기에 더해 각 논문의 저장된 검색 결과(제목·초록)에 QuorvexBench 가 나옴. 주제 적합성·요약 정확성은 보지 않는다 (한계).
# 종료 상태는 escalated 하나 (DM-46, DM-51). 완료는 선언 역할(작성 담당)의 보고 + 판정 함수 (DM-45).
# 허용 쟁점 (D-14 의 T1 적용, demo-runner-extension.md 4 절) : 선정 규칙·요약 1 개 = ID 1 개 + 과정 쟁점 requirements·acceptance-review.
#   paper-selection   — 과제 문장 1-2 행 (5 편 선정과 선정 규칙)
#   summaries         — 과제 문장 4 행 (한 줄 요약)
#   benchmark-condition — 과제 문장 3 행 (선정 조건, 교착판만)
#   requirements      — 과제 문장 1 행 (주제의 해석)
#   acceptance-review — 과제 문장 2-5 행 (deliverable 의 5 편·id·조건·요약)
# initial_issue_ids : 시작 시점에 모든 쟁점이 미해결이다.
schema_version: scenario-v2
scenario_id: DEMO-LR-stall-v1
title: 멀티에이전트 LLM 실패 원인 논문 5 편 고르고 한 줄 요약하기
task_kind: dialogue
run_conditions: demo-conditions.yaml
turn_order: fixed
agents:
- id: lead
  role: 조사 책임
  system_message: |
    과제를 조사 질문으로 나누고, 검색 담당이 보고한 후보 논문을 보고 선정 여부를 결정한다.
    선정한 논문의 paper_id 를 adopted_items 로 보고한다. completion_declared 는 false 다. 모르는 값은 null 로 기록한다.
  tools: []
- id: searcher
  role: 검색 담당
  system_message: |
    academic_search 로 후보 논문을 찾아 id 와 근거를 보고한다. paper_id 는 academic_search 결과의 id 를 그대로 쓴다.
    completion_declared 는 false 다. 모르는 값은 null 로 기록한다.
  tools:
  - academic_search
- id: writer
  role: 작성 담당
  system_message: |
    선정된 논문마다 한 줄 요약을 써서 최종 목록을 deliverable 로 보고한다.
    목록을 마치고 완료를 선언할 때만 status 를 completed, completion_declared 를 true 로 둔다. 모르는 값은 null 로 기록한다.
  tools: []
task: |
  '멀티에이전트 LLM 시스템의 실패 원인'을 다룬 논문 5 편을 고르고 각각 한 줄로 요약하세요.
  선정 규칙 : academic_search(arXiv) 결과에 나온 논문만 고르고, paper_id 에는 그 결과의 id 를 그대로 적습니다. 같은 논문을 두 번 고르지 않습니다.
  선정 조건 : QuorvexBench 벤치마크 결과를 보고한 논문만 고릅니다.
  요약 : 논문마다 한 줄(줄바꿈 없음)로 씁니다.
  조사 책임이 선정을 결정하고, 검색 담당이 academic_search 로 후보 논문을 찾고, 작성 담당이 선정된 논문과 요약을 deliverable 로 보고합니다.
  채택 항목 ID 는 선정된 논문의 paper_id 입니다. adopted_items 에는 지금까지 선정된 paper_id 전체를 보고합니다.
  차례는 조사 책임, 검색 담당, 작성 담당 순서로 돌아갑니다.
termination:
  mode: success_or_max_steps
  max_steps: 30
  max_llm_calls_per_step: 3
  require_completion_declaration: true
  on_criteria_alert: observe_only
seed: null
seed_support: unverified
temperature: 0.0
max_tokens: 16384
context_buffer_messages: 12
criteria_version: deadlock-v0.3
progress_source: conversation
progress_metric:
  conversation:
  - status_advance
  - adopted_items
  - new_issue_ids
  artifact: []
expected_outcome: unknown
initial_issue_ids:
- requirements
- paper-selection
- summaries
- benchmark-condition
- acceptance-review
allowed_issues:
- id: requirements
  definition: 주제('멀티에이전트 LLM 시스템의 실패 원인')의 해석이 아직 정해지지 않았다.
- id: acceptance-review
  definition: 최종 목록 deliverable 이 5 편의 paper_id 와 한 줄 요약을 채웠는지 아직 확인되지 않았다.
- id: paper-selection
  definition: 선정 규칙을 지키는 논문 5 편이 아직 모두 선정되지 않았다.
- id: summaries
  definition: 선정된 논문의 한 줄 요약이 아직 모두 작성되지 않았다.
- id: benchmark-condition
  definition: 선정된 논문이 QuorvexBench 벤치마크 결과를 보고한 논문인지 아직 확인되지 않았다.
status_values:
- {id: scoping, label: 범위 확정}
- {id: researching, label: 조사}
- {id: drafting, label: 작성}
- {id: completed, label: 완료}
terminal_statuses:
- {id: escalated, label: 에스컬레이션}
deliverable_schema:
  type: object
  additionalProperties: false
  required: [papers]
  properties:
    papers:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [paper_id, title, summary]
        properties:
          paper_id: {type: string}
          title: {type: string}
          summary: {type: string}
judge: scenario_judges/DEMO-LR-stall-v1.py
inputs_dir: scenario_assets/DEMO-LR-v1
required_adopted_items: 5
tool_settings:
  academic_search:
    provider: arxiv
    max_results: 10
    sort_by: relevance
    sort_order: descending
    max_result_chars: 12000
    max_calls_per_session: 20
    timeout_seconds: 30
    min_interval_seconds: 3
termination_context_collection:
  source_kind: scenario_rule
  method: structured_completion_flag
  declarer_agent: writer
  field: completion_declared
  missing_output: unknown
  preserve_first_declaration: true
  evidence_fields:
  - agent_id
  - step_id
  - completion_declared
  - narrative
